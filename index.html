<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>待ち時間</title>

<style>

body{
margin:0;
background:black;
color:#0ff;
font-family:monospace;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

#text{
font-size:120px;
text-shadow:0 0 20px #0ff;
text-align:center;
}

</style>
</head>
<body>

<div id="text">
読み込み中...
</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzVzYZLZZelQlv-jOu7AvV3-c1q80pKCDD7BJVNveukzUh3YCKP-3B3usDbSgAvuAS4/exec";

function loadData(){

fetch(GAS_URL)
.then(r=>r.json())
.then(data=>{

const value =
String(data.value).trim();

if(
value !== "" &&
!isNaN(value)
){

document.getElementById("text")
.textContent =
value + "分待ち";

}else{

document.getElementById("text")
.textContent =
value;

}

});

}

loadData();

setInterval(
loadData,
3000
);

</script>

</body>
</html>
