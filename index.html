<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>待ち時間</title>

<style>

body{
margin:0;
background:black;
color:#0ff;
font-family:monospace;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

#text{
font-size:120px;
text-align:center;
text-shadow:
0 0 5px #0ff,
0 0 20px #0ff,
0 0 40px #0ff;
}

#light{

position:fixed;
top:20px;
right:20px;

width:30px;
height:30px;

border-radius:50%;

background:gray;

box-shadow:0 0 20px currentColor;

}

#logo{

position:fixed;
top:20px;
left:20px;

width:150px;
height:auto;

z-index:9999;

}


</style>

<body>

<img id="logo" src="argus.png">

<div id="light"></div>

<div id="text">
読み込み中...
</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/あなたのGASURL/exec";

function loadData(){

fetch(GAS_URL)
.then(r=>r.json())
.then(data=>{

const value =
String(data.value).trim();

if(
value !== "" &&
!isNaN(value)
){

document
.getElementById("text")
.textContent =
value + "分待ち";

}else{

document
.getElementById("text")
.textContent =
value;

}

const light =
document.getElementById("light");

if(data.status === "available"){

light.style.background =
"#00aaff";

}
else if(data.status === "busy"){

light.style.background =
"red";

}
else if(data.status === "inactive"){

light.style.background =
"yellow";

}
else{

light.style.background =
"gray";

}

});

}

loadData();

setInterval(
loadData,
3000
);

</script>

</body>
</head>
