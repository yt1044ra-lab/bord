<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>待ち時間設定</title>

<style>

body{
background:#000;
color:#0ff;
font-family:monospace;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

input{
padding:15px;
font-size:24px;
background:#111;
color:#0ff;
border:2px solid #0ff;
width:300px;
text-align:center;
}

button{
margin:10px;
padding:12px 30px;
font-size:20px;
background:black;
color:#0ff;
border:2px solid #0ff;
cursor:pointer;
}

button:hover{
box-shadow:0 0 15px #0ff;
}

.statusButtons{
margin-top:20px;
}

#logo{

position:fixed;
top:20px;
left:20px;

width:150px;
height:auto;

z-index:9999;

}

</style>
</head>

<body>

<img id="logo" src="argus.png">

<h1>待ち時間設定</h1>

<input
id="value"
placeholder="例: 5 / 点検中">

<button onclick="saveValue()">
更新
</button>

<div class="statusButtons">

<button onclick="setStatus('available')">
案内可
</button>

<button onclick="setStatus('busy')">
案内中
</button>

<button onclick="setStatus('inactive')">
不使用
</button>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbza52ajF9GcRs3zsg5yEqhF_CURiXvi4Z2wMH_XdfWOap9aHGxkWe0S1MB99RL0xu8N/exec";

function saveValue(){

const value =
document.getElementById("value").value;

fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({
value:value
})
})
.then(()=>alert("更新しました"));

}

function setStatus(status){

fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({
status:status
})
})
.then(()=>alert("状態更新"));

}

</script>

</body>
</html>
